{% extends 'base.html' %}
{% block content %}
    <div class="box-details">
        <h1>Delete Grimoire</h1>
        <p>Are you sure you want to delete this grimoire entry?</p>
        <form method="post">
            {{ form }}
            {% csrf_token %}
            <button class="delete-btn" type="submit">Yes, Delete</button>
            <button class="cancel-btn" onclick="window.location='{% url 'grimoire_list' %}'" type="button">Cancel</button>
        </form>
    </div>
{% endblock %}
