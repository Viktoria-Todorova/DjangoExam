{% extends 'base.html' %}

{% block content %}
<div class="box-details">
    <h1>Your Profile</h1>

    {% if messages %}
        {% for message in messages %}
            <p style="color: #ffd700; text-align: center;">{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save Changes</button>
    </form>
</div>
{% endblock %}
